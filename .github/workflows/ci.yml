name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The engines range is `^22.19.0 || >=24.0.0`, so both ends are covered.
        # Windows is included because the package-manager resolution and the
        # command-script spawn path only execute there.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Record the environment before anything can fail, so a platform-specific
      # failure always arrives with the platform facts attached.
      - name: Record environment
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-report
          {
            echo "node     : $(node --version)"
            echo "platform : $(node -e "process.stdout.write(process.platform + ' ' + process.arch)")"
            echo "tar      : $(command -v tar || echo MISSING)"
            echo "gzip     : $(command -v gzip || echo MISSING)"
            echo "pnpm     : $(command -v pnpm || echo MISSING)"
            echo "npm      : $(command -v npm || echo MISSING)"
          } > "ci-report/${{ matrix.os }}-${{ matrix.node }}.txt" 2>&1

      # No install step: the package has no dependencies and the suite is
      # deliberately offline. Each file is its own step, because a single
      # `node --test tests/*.test.mjs` collapses four files into one exit code,
      # which is how a cross-platform failure becomes an unactionable log line.
      #
      # Output is captured to a file and re-printed with `if: always()`, so a
      # failure's full stack trace reaches the run log instead of being truncated
      # by the UI. `tee` keeps the step's own exit status meaningful.
      - name: core.test.mjs
        run: node --test --test-reporter=spec tests/core.test.mjs 2>&1 | tee ci-report/core.log

      - name: apply.test.mjs
        run: node --test --test-reporter=spec tests/apply.test.mjs 2>&1 | tee ci-report/apply.log

      - name: cli.test.mjs
        run: node --test --test-reporter=spec tests/cli.test.mjs 2>&1 | tee ci-report/cli.log

      - name: host.test.mjs
        run: node --test --test-reporter=spec tests/host.test.mjs 2>&1 | tee ci-report/host.log

      - name: Print captured test output
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          for f in ci-report/core.log ci-report/apply.log ci-report/cli.log ci-report/host.log; do
            [ -e "$f" ] || continue
            echo "=================== $f — HEAD (60 lines, the stack lives here) ==================="
            head -n 60 "$f"
            echo "=================== $f — TAIL (40 lines) ==================="
            tail -n 40 "$f"
          done

      - name: Diagnose runner environment
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo "--- node ---"
          node --version
          node -e "console.log(process.platform, process.arch, process.execPath)"
          echo "--- test runner on a trivial file ---"
          printf "import test from 'node:test'\nimport assert from 'node:assert'\ntest('trivial', () => assert.equal(1,1))\n" > ci-report/trivial.test.mjs
          node --test --test-reporter=spec ci-report/trivial.test.mjs 2>&1 | tail -n 20
          echo "trivial exit: $?"
          echo "--- can the runner load a project file by path? ---"
          node --test --test-reporter=spec tests/host.test.mjs 2>&1 | head -n 15

      - name: Check the release artifact
        run: node scripts/check-pack.mjs

      - name: Prove the packed artifact installs and runs
        run: node scripts/check-install.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-report-${{ matrix.os }}-${{ matrix.node }}
          path: ci-report/
          if-no-files-found: warn
          retention-days: 7
