name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The engines range is `^22.19.0 || >=24.0.0`, so both ends are covered.
        # Windows is included because the package-manager resolution and the
        # command-script spawn path only execute there.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Record the environment before anything can fail, so a platform-specific
      # failure always arrives with the platform facts attached.
      - name: Record environment
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-report
          {
            echo "node     : $(node --version)"
            echo "platform : $(node -e "process.stdout.write(process.platform + ' ' + process.arch)")"
            echo "tar      : $(command -v tar || echo MISSING)"
            echo "gzip     : $(command -v gzip || echo MISSING)"
            echo "pnpm     : $(command -v pnpm || echo MISSING)"
            echo "npm      : $(command -v npm || echo MISSING)"
          } > "ci-report/${{ matrix.os }}-${{ matrix.node }}.txt" 2>&1

      # No install step: the package has no dependencies and the suite is
      # deliberately offline.
      #
      # The files are run directly rather than through `node --test`. The
      # runner loads each file in a worker, and on the Linux and macOS runners
      # that step failed with MODULE_NOT_FOUND and an empty requireStack from
      # executeUserEntryPoint — the loader failing to run the file as an entry
      # point, not a failing assertion. The files import `node:test`
      # themselves, so a direct run still reports TAP and still exits non-zero
      # on failure; it just skips the extra process boundary.
      #
      # Each file is its own step so a failure names the file, and output is
      # captured and reprinted head and tail with `if: always()` so the stack
      # reaches the log instead of being truncated by the UI.
      - name: core.test.mjs
        run: node tests/core.test.mjs 2>&1 | tee ci-report/core.log

      - name: apply.test.mjs
        run: node tests/apply.test.mjs 2>&1 | tee ci-report/apply.log

      - name: cli.test.mjs
        run: node tests/cli.test.mjs 2>&1 | tee ci-report/cli.log

      - name: host.test.mjs
        run: node tests/host.test.mjs 2>&1 | tee ci-report/host.log

      - name: Print captured test output
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          for f in ci-report/core.log ci-report/apply.log ci-report/cli.log ci-report/host.log; do
            [ -e "$f" ] || continue
            echo "=================== $f — HEAD (60 lines, the stack lives here) ==================="
            head -n 60 "$f"
            echo "=================== $f — TAIL (40 lines) ==================="
            tail -n 40 "$f"
          done

      - name: Check the release artifact
        run: node scripts/check-pack.mjs

      - name: Prove the packed artifact installs and runs
        run: node scripts/check-install.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-report-${{ matrix.os }}-${{ matrix.node }}
          path: ci-report/
          if-no-files-found: warn
          retention-days: 7
